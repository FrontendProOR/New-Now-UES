# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/ues_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Belgrade
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# ==============================
# MinIO
# ==============================
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=ues-bucket

# ==============================
# Elasticsearch
# ==============================
spring.elasticsearch.uris=http://localhost:9200

# ==============================
# Mail
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================
# Jackson
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Belgrade
