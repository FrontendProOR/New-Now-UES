<div class="container py-4">
  <h2 class="mb-3">Locations</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="searchName" class="form-label">Name</label>
            <input type="text" class="form-control" id="searchName" formControlName="name" placeholder="Location name">
          </div>
          <div class="col-md-3">
            <label for="searchAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="searchAddress" formControlName="address" placeholder="Address">
          </div>
          <div class="col-md-3">
            <label for="searchType" class="form-label">Type</label>
            <input type="text" class="form-control" id="searchType" formControlName="type" placeholder="Type">
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-primary me-2">
              <i class="bi bi-search me-1"></i>Search
            </button>
            <button type="button" class="btn btn-outline-secondary" (click)="onClear()">Clear</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let loc of locations">
      <div class="card h-100" [routerLink]="['/locations', loc.id]" style="cursor: pointer;">
        <img [src]="loc.imageUrl" [alt]="loc.name" class="card-img-top" *ngIf="loc.imageUrl">
        <div class="card-body">
          <h5 class="card-title">{{ loc.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ loc.address }} &middot; {{ loc.type }}</h6>
          <p class="card-text" *ngIf="loc.description">{{ loc.description | slice:0:100 }}...</p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" *ngIf="loc.totalRating">
          <span class="badge bg-warning text-dark">
            <i class="bi bi-star-fill me-1"></i>{{ loc.totalRating | number:'1.1-1' }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-info mt-4" *ngIf="locations.length === 0">No locations found.</div>
</div>
