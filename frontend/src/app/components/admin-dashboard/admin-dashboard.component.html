<div class="container">
  <h2>Admin Dashboard</h2>

  <mat-tab-group [(selectedIndex)]="activeTab">
    <mat-tab label="Account Requests ({{ pendingRequests.length }})">
      <div class="tab-content">
        <mat-card *ngFor="let req of pendingRequests" class="request-card">
          <mat-card-header>
            <mat-card-title>{{ req.email }}</mat-card-title>
            <mat-card-subtitle>{{ req.createdAt | date }} · {{ req.address }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="acceptRequest(req.id)">Accept</button>
            <button mat-raised-button color="warn" (click)="rejectRequest(req.id)">Reject</button>
          </mat-card-actions>
        </mat-card>
        <p *ngIf="pendingRequests.length === 0">No pending requests.</p>
      </div>
    </mat-tab>

    <mat-tab label="Locations">
      <div class="tab-content">
        <mat-card class="form-card">
          <mat-card-header><mat-card-title>Create Location</mat-card-title></mat-card-header>
          <mat-card-content>
            <form [formGroup]="locationForm" (ngSubmit)="createLocation()" class="create-form">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address</mat-label>
                <input matInput formControlName="address">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Type</mat-label>
                <input matInput formControlName="type">
              </mat-form-field>
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Description</mat-label>
                <textarea matInput formControlName="description" rows="3"></textarea>
              </mat-form-field>
              <div class="file-input"><label>Image *:</label> <input type="file" (change)="onImageSelected($event)" accept="image/*"></div>
              <div class="file-input"><label>PDF (optional):</label> <input type="file" (change)="onPdfSelected($event)" accept=".pdf"></div>
              <button mat-raised-button color="primary" type="submit" [disabled]="locationForm.invalid || !selectedImage">Create</button>
            </form>
          </mat-card-content>
        </mat-card>

        <h3>Existing Locations</h3>
        <mat-card *ngFor="let loc of locations" class="location-card">
          <mat-card-header>
            <mat-card-title>{{ loc.name }}</mat-card-title>
            <mat-card-subtitle>{{ loc.address }} · {{ loc.type }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-actions>
            <button mat-button color="primary" (click)="assignManager(loc.id)">Assign Manager</button>
            <button mat-button (click)="removeManager(loc.id)">Remove Manager</button>
            <button mat-button color="warn" (click)="deleteLocation(loc.id)">Delete</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
