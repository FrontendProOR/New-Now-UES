<div class="container py-4">
  <h2 class="mb-3">Events</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form [formGroup]="filterForm" (ngSubmit)="onFilter()">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label for="filterType" class="form-label">Type</label>
            <input type="text" class="form-control" id="filterType" formControlName="type" placeholder="Event type">
          </div>
          <div class="col-md-3">
            <label for="filterLocation" class="form-label">Location</label>
            <select class="form-select" id="filterLocation" formControlName="locationId">
              <option value="">All</option>
              <option *ngFor="let loc of locations" [value]="loc.id">{{ loc.name }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="filterAddress" class="form-label">Address</label>
            <input type="text" class="form-control" id="filterAddress" formControlName="address" placeholder="Address">
          </div>
          <div class="col-md-3">
            <label for="filterMinPrice" class="form-label">Min Price</label>
            <input type="number" class="form-control" id="filterMinPrice" formControlName="minPrice" placeholder="0">
          </div>
        </div>
        <div class="row g-3 mt-1 align-items-end">
          <div class="col-md-3">
            <label for="filterMaxPrice" class="form-label">Max Price</label>
            <input type="number" class="form-control" id="filterMaxPrice" formControlName="maxPrice" placeholder="Max">
          </div>
          <div class="col-md-3">
            <label for="filterDateFrom" class="form-label">Date From</label>
            <input type="date" class="form-control" id="filterDateFrom" formControlName="dateFrom">
          </div>
          <div class="col-md-3">
            <label for="filterDateTo" class="form-label">Date To</label>
            <input type="date" class="form-control" id="filterDateTo" formControlName="dateTo">
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-primary me-2">
              <i class="bi bi-funnel me-1"></i>Filter
            </button>
            <button type="button" class="btn btn-outline-secondary" (click)="onClear()">Clear</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4" *ngFor="let event of events">
      <div class="card h-100" [routerLink]="['/locations', event.locationId]" style="cursor: pointer;">
        <img [src]="event.imageUrl" [alt]="event.name" class="card-img-top" *ngIf="event.imageUrl">
        <div class="card-body">
          <h5 class="card-title">{{ event.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ event.date | date }} &middot; {{ event.locationName }}</h6>
          <p class="card-text">{{ event.type }} &middot; {{ event.address }}</p>
          <span class="badge bg-success" *ngIf="event.price === 0">Free</span>
          <span class="badge bg-primary" *ngIf="event.price > 0">{{ event.price }} RSD</span>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-info mt-4" *ngIf="events.length === 0">No events found.</div>
</div>
