<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Dobrodosli u New Now</h2>
        <p class="text-muted">Otkrijte najbolja mesta, dogadjaje i utiske u vasem gradu. Prijavite se da biste nastavili.</p>
      </div>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="card-title mb-3">Login</h4>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" formControlName="email" placeholder="name@example.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" formControlName="password">
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </button>
          </form>
        </div>
        <div class="card-footer text-center bg-light">
          <a routerLink="/register" class="text-decoration-none">Don't have an account? Register</a>
        </div>
      </div>
    </div>
  </div>
</div>
