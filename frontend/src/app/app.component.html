<mat-toolbar color="primary">
  <mat-icon>event</mat-icon>
  <span style="margin-left: 8px; cursor: pointer;" routerLink="/home">{{ title }}</span>

  <span class="spacer"></span>

  <ng-container *ngIf="currentUser$ | async as user; else guestLinks">
    <button mat-button routerLink="/home" routerLinkActive="active-link">Home</button>
    <button mat-button routerLink="/locations" routerLinkActive="active-link">Locations</button>
    <button mat-button routerLink="/events" routerLinkActive="active-link">Events</button>
    <button mat-button routerLink="/search" routerLinkActive="active-link">Search</button>

    <button mat-button routerLink="/admin" routerLinkActive="active-link"
            *ngIf="isAdmin$ | async">Admin</button>
    <button mat-button routerLink="/manager" routerLinkActive="active-link"
            *ngIf="isManagerOrAdmin$ | async">Manager</button>

    <button mat-icon-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div mat-menu-item disabled>{{ user.email }}</div>
      <mat-divider></mat-divider>
      <button mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon> Profile
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon> Logout
      </button>
    </mat-menu>
  </ng-container>

  <ng-template #guestLinks>
    <button mat-button routerLink="/login" routerLinkActive="active-link">Login</button>
    <button mat-raised-button color="accent" routerLink="/register">Register</button>
  </ng-template>
</mat-toolbar>

<router-outlet></router-outlet>
