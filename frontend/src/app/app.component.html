          <li class="nav-item">

          </li>

            <a class="nav-link" routerLink="/locations" routerLinkActive="active">Locations</a>

          <li class="nav-item">
            <a class="nav-link" routerLink="/search" routerLinkActive="active">Search</a>
          </li>
          <li class="nav-item" *ngIf="isAdmin$ | async">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active">Admin</a>
          </li>
          <li class="nav-item" *ngIf="isManagerOrAdmin$ | async">
            <a class="nav-link" routerLink="/manager" routerLinkActive="active">Manager</a>
